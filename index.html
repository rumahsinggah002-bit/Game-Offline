<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="Game offline Tangkap Bintang">
<link rel="manifest" href="manifest.json">
<title>Tangkap Bintang</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,Arial;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.app{width:min(100%,480px);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:28px;margin:8px 0;color:#facc15}.score{font-weight:700;background:#243247;padding:10px 15px;border-radius:12px}
canvas{width:100%;height:auto;background:linear-gradient(#172b48,#0b1423);border:2px solid #34465f;border-radius:18px;display:block;touch-action:none}
p{color:#cbd5e1}.controls{display:flex;gap:12px;justify-content:center;margin-top:14px}
button{border:0;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:700;background:#facc15;color:#172033}
#start{background:#22c55e;color:#06210f}.hint{font-size:13px}
</style>
</head>
<body>
<main class="app">
 <div class="top"><div style="text-align:left"><div style="font-size:12px;color:#9fb0c6">GAME OFFLINE</div><h1>⭐ Tangkap Bintang</h1></div><div class="score">Skor: <span id="score">0</span></div></div>
 <canvas id="game" width="420" height="560" aria-label="Area permainan"></canvas>
 <p id="status">Tangkap bintang yang jatuh. Hindari bom!</p>
 <div class="controls"><button id="left">◀ Kiri</button><button id="start">MULAI</button><button id="right">Kanan ▶</button></div>
 <p class="hint">Geser jari di layar atau gunakan tombol kiri/kanan. Game dapat dimainkan tanpa internet setelah dibuka pertama kali.</p>
</main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');
let player={x:180,y:500,w:60,h:22},items=[],score=0,playing=false,frame=0,move=0,raf;
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 // stars background
 for(let i=0;i<35;i++){let x=(i*83)%420,y=(i*137+frame*.35)%560;ctx.fillStyle='#64748b';ctx.fillRect(x,y,2,2)}
 ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.roundRect(player.x,player.y,player.w,player.h,9);ctx.fill();
 ctx.fillStyle='#e0f2fe';ctx.fillRect(player.x+12,player.y+5,player.w-24,4);
 items.forEach(o=>{ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText(o.bomb?'💣':'⭐',o.x,o.y)});
 if(!playing){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,420,560);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 26px system-ui';ctx.fillText('TANGKAP BINTANG',210,245);ctx.font='16px system-ui';ctx.fillText('Tekan MULAI untuk bermain',210,280)}
}
function loop(){
 if(!playing)return;frame++;player.x=Math.max(0,Math.min(360,player.x+move*6));
 if(frame%42===0)items.push({x:20+Math.random()*380,y:-10,bomb:Math.random()<.22,speed:2+Math.random()*2});
 items.forEach(o=>o.y+=o.speed);
 for(let i=items.length-1;i>=0;i--){let o=items[i];if(o.y>player.y-8&&o.y<player.y+player.h+12&&o.x>player.x-8&&o.x<player.x+player.w+8){if(o.bomb){end();return}else{score+=10;scoreEl.textContent=score;items.splice(i,1)}}else if(o.y>580)items.splice(i,1)}
 draw();raf=requestAnimationFrame(loop)
}
function end(){playing=false;cancelAnimationFrame(raf);statusEl.textContent='Game selesai! Skor akhir: '+score+'. Tekan MULAI untuk mencoba lagi.';draw()}
function start(){score=0;scoreEl.textContent='0';items=[];frame=0;player.x=180;playing=true;statusEl.textContent='Ayo tangkap bintangnya!';cancelAnimationFrame(raf);loop()}
document.getElementById('start').onclick=start;
function hold(dir,el){el.addEventListener('pointerdown',e=>{e.preventDefault();move=dir});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>move=0))}
hold(-1,document.getElementById('left'));hold(1,document.getElementById('right'));
c.addEventListener('pointermove',e=>{if(!playing)return;let r=c.getBoundingClientRect();player.x=Math.max(0,Math.min(360,(e.clientX-r.left)/r.width*420-player.w/2))});
draw();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
